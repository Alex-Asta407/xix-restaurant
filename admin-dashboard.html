<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XIX Admin Dashboard</title>
    <link rel="icon" type="image/x-icon" href="photos/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="photos/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="photos/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="photos/apple-icon-180x180.png">
    <!-- styles.css removed - not needed, styles are inline -->
    <link href="https://fonts.googleapis.com/css2?family=Gilda+Display&family=Noto+Sans:wght@400;500&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .admin-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
            background: var(--white);
            min-height: 100vh;
        }

        .admin-header {
            text-align: center;
            margin-bottom: 2rem;
            padding: 2rem;
            background: var(--primary-green);
            border-radius: 12px;
        }

        .admin-header h1 {
            font-family: 'Gilda Display', serif;
            color: var(--very-dark-green);
            margin-bottom: 0.5rem;
        }

        .admin-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .stat-card {
            background: var(--white);
            padding: 1.5rem;
            border-radius: 12px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1);
            text-align: center;
            border: 1px solid rgba(168, 135, 26, 0.1);
        }

        .stat-number {
            font-size: 2rem;
            font-weight: bold;
            color: var(--gold);
            margin-bottom: 0.5rem;
        }

        .stat-label {
            color: var(--very-dark-green);
            font-size: 0.9rem;
        }

        .reservations-table {
            background: var(--white);
            border-radius: 12px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        .table-header {
            background: var(--primary-green);
            padding: 1rem;
            border-bottom: 1px solid rgba(168, 135, 26, 0.1);
        }

        .table-header h2 {
            font-family: 'Gilda Display', serif;
            color: var(--very-dark-green);
            margin: 0;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 1rem;
            text-align: left;
            border-bottom: 1px solid #eee;
        }

        th {
            background: #f8f9fa;
            font-weight: 600;
            color: var(--very-dark-green);
        }

        .email-status {
            display: inline-block;
            padding: 0.25rem 0.5rem;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: 500;
        }

        .email-sent {
            background: #d4edda;
            color: #155724;
        }

        .email-not-sent {
            background: #f8d7da;
            color: #721c24;
        }

        .refresh-btn {
            background: var(--gold);
            color: var(--white);
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.3s ease;
            margin-bottom: 1rem;
        }

        .refresh-btn:hover {
            background: #A8871A;
            transform: translateY(-2px);
        }

        .loading {
            text-align: center;
            padding: 2rem;
            color: var(--very-dark-green);
        }

        .error {
            background: #f8d7da;
            color: #721c24;
            padding: 1rem;
            border-radius: 8px;
            margin: 1rem 0;
        }

        .blocks-section {
            background: var(--white);
            border-radius: 12px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1);
            padding: 1.5rem;
            margin-bottom: 2rem;
        }

        .blocks-section h2 {
            font-family: 'Gilda Display', serif;
            color: var(--very-dark-green);
            margin-bottom: 1rem;
        }

        .venue-tabs {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
        }

        .venue-tab {
            flex: 1;
            padding: 0.8rem;
            text-align: center;
            border: 2px solid var(--very-dark-green);
            border-radius: 5px;
            cursor: pointer;
            font-weight: 600;
            color: var(--very-dark-green);
            background: var(--white);
        }

        .venue-tab.active {
            background: var(--very-dark-green);
            color: var(--white);
        }

        .block-type-toggle {
            display: flex;
            gap: 1rem;
            margin-bottom: 1rem;
        }

        .block-type-toggle label {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            font-weight: 500;
            cursor: pointer;
        }

        .form-row {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            margin-bottom: 1rem;
        }

        .form-row .field {
            display: flex;
            flex-direction: column;
            gap: 0.3rem;
        }

        .form-row label {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--very-dark-green);
        }

        .form-row input,
        .form-row select {
            padding: 0.6rem;
            border: 1px solid #eee;
            border-radius: 5px;
            font-size: 0.95rem;
        }

        .block-submit-btn {
            background: var(--gold);
            color: var(--white);
            padding: 0.8rem 1.5rem;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 600;
        }

        .block-submit-btn:hover {
            opacity: 0.9;
        }

        .block-feedback {
            margin-top: 0.8rem;
            font-weight: 500;
        }

        .block-feedback.error {
            color: #c62828;
        }

        .block-feedback.success {
            color: #2e7d32;
        }

        .blocks-list {
            margin-top: 1.5rem;
        }

        .block-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.8rem 1rem;
            border: 1px solid #eee;
            border-radius: 6px;
            margin-bottom: 0.6rem;
        }

        .block-item .block-info strong {
            color: var(--very-dark-green);
        }

        .block-remove-btn {
            background: #e74c3c;
            color: var(--white);
            border: none;
            border-radius: 5px;
            padding: 0.5rem 1rem;
            cursor: pointer;
        }

        .block-remove-btn:hover {
            background: #c0392b;
        }
    </style>
</head>

<body>
    <div class="admin-container">
        <div class="admin-header">
            <h1><i class="fas fa-utensils"></i> XIX Admin Dashboard</h1>
            <p>Restaurant Reservation Management</p>
        </div>

        <button class="refresh-btn" id="refreshBtn">
            <i class="fas fa-sync-alt"></i> Refresh Today's Reservations
        </button>

        <div class="admin-stats" id="stats">
            <div class="stat-card">
                <div class="stat-number" id="totalToday">-</div>
                <div class="stat-label">Today's Reservations</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="emailsSent">-</div>
                <div class="stat-label">Emails Sent</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="pendingEmails">-</div>
                <div class="stat-label">Pending Emails</div>
            </div>
        </div>

        <div class="blocks-section">
            <h2>Pause Reservations</h2>
            <p>Stop new reservations for XIX or Mirror, for a whole day or a set number of hours.</p>

            <div class="venue-tabs">
                <div class="venue-tab active" id="venueTabXix" data-venue="XIX">XIX</div>
                <div class="venue-tab" id="venueTabMirror" data-venue="MIRROR">Mirror</div>
            </div>

            <div class="block-type-toggle">
                <label><input type="radio" name="blockType" value="full_day" checked> Block the whole day</label>
                <label><input type="radio" name="blockType" value="hours"> Block specific hours</label>
            </div>

            <div class="form-row">
                <div class="field">
                    <label for="blockDate">Date</label>
                    <input type="date" id="blockDate">
                </div>
            </div>

            <div class="form-row" id="hoursFields" style="display: none;">
                <div class="field">
                    <label for="blockDuration">How many hours</label>
                    <select id="blockDuration">
                        <option value="">Custom (use From/Till)</option>
                        <option value="1">1 hour</option>
                        <option value="2">2 hours</option>
                        <option value="3">3 hours</option>
                        <option value="4">4 hours</option>
                        <option value="5">5 hours</option>
                        <option value="6">6 hours</option>
                        <option value="8">8 hours</option>
                        <option value="12">12 hours</option>
                    </select>
                </div>
                <div class="field">
                    <label for="blockFrom">From</label>
                    <input type="time" id="blockFrom" step="1800">
                </div>
                <div class="field">
                    <label for="blockTill">Till</label>
                    <input type="time" id="blockTill" step="1800">
                </div>
            </div>

            <button class="block-submit-btn" id="submitBlockBtn">Block Reservations</button>
            <div class="block-feedback" id="blockFeedback"></div>

            <div class="blocks-list" id="blocksList">
                <p style="color: #888;">Loading active blocks...</p>
            </div>
        </div>

        <div class="reservations-table">
            <div class="table-header">
                <h2><i class="fas fa-calendar-day"></i> Today's Reservations</h2>
            </div>
            <div id="reservations-content">
                <div class="loading">
                    <i class="fas fa-spinner fa-spin"></i> Loading reservations...
                </div>
            </div>
        </div>
    </div>

    <script>
        // Get the secret key from URL parameters
        const urlParams = new URLSearchParams(window.location.search);
        const secretKey = urlParams.get('key');

        if (!secretKey) {
            document.body.innerHTML = '<div class="admin-container"><div class="error">Access denied. Please provide a valid secret key.</div></div>';
        }

        async function loadTodayReservations() {
            const content = document.getElementById('reservations-content');
            content.innerHTML = '<div class="loading"><i class="fas fa-spinner fa-spin"></i> Loading reservations...</div>';

            try {
                const response = await fetch(`/admin/today?key=${secretKey}`);

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const data = await response.json();
                displayReservations(data);
                updateStats(data);

            } catch (error) {
                console.error('Error loading reservations:', error);
                content.innerHTML = '<div class="error">Error loading reservations. Please check your connection and try again.</div>';
            }
        }

        function displayReservations(data) {
            const content = document.getElementById('reservations-content');

            if (data.reservations.length === 0) {
                content.innerHTML = '<div style="padding: 2rem; text-align: center; color: var(--very-dark-green);">No reservations for today.</div>';
                return;
            }

            let tableHTML = `
                <table>
                    <thead>
                        <tr>
                            <th>Time</th>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Phone</th>
                            <th>Guests</th>
                            <th>Table</th>
                            <th>Occasion</th>
                            <th>Customer Email</th>
                            <th>Manager Email</th>
                            <th>Created</th>
                        </tr>
                    </thead>
                    <tbody>
            `;

            data.reservations.forEach(reservation => {
                const time = formatTime(reservation.time);
                const created = new Date(reservation.created_at).toLocaleString();

                tableHTML += `
                    <tr>
                        <td><strong>${time}</strong></td>
                        <td>${reservation.name}</td>
                        <td>${reservation.email}</td>
                        <td>${reservation.phone}</td>
                        <td>${reservation.guests}</td>
                        <td>${reservation.table_preference || 'Any'}</td>
                        <td>${reservation.occasion || '-'}</td>
                        <td><span class="email-status ${reservation.email_sent_to_customer ? 'email-sent' : 'email-not-sent'}">${reservation.email_sent_to_customer ? 'Sent' : 'Not Sent'}</span></td>
                        <td><span class="email-status ${reservation.email_sent_to_manager ? 'email-sent' : 'email-not-sent'}">${reservation.email_sent_to_manager ? 'Sent' : 'Not Sent'}</span></td>
                        <td>${created}</td>
                    </tr>
                `;
            });

            tableHTML += '</tbody></table>';
            content.innerHTML = tableHTML;
        }

        function updateStats(data) {
            const totalToday = data.totalReservations;
            const emailsSent = data.reservations.filter(r => r.email_sent_to_customer && r.email_sent_to_manager).length;
            const pendingEmails = totalToday - emailsSent;

            document.getElementById('totalToday').textContent = totalToday;
            document.getElementById('emailsSent').textContent = emailsSent;
            document.getElementById('pendingEmails').textContent = pendingEmails;
        }

        function formatTime(time24) {
            const [hours, minutes] = time24.split(':');
            const hour = parseInt(hours);
            const ampm = hour >= 12 ? 'PM' : 'AM';
            const displayHour = hour % 12 || 12;
            return `${displayHour}:${minutes} ${ampm}`;
        }

        // Set up refresh button
        document.addEventListener('DOMContentLoaded', function() {
            const refreshBtn = document.getElementById('refreshBtn');
            if (refreshBtn) {
                refreshBtn.addEventListener('click', function() {
                    loadTodayReservations();
                });
            }
            if (secretKey) {
                initBlocksSection();
            }
        });

        // Load reservations on page load
        if (secretKey) {
            loadTodayReservations();
        }

        // ==================== Reservation Blocks ====================

        let selectedVenue = 'XIX';

        function initBlocksSection() {
            const venueTabXix = document.getElementById('venueTabXix');
            const venueTabMirror = document.getElementById('venueTabMirror');
            const blockDate = document.getElementById('blockDate');
            const blockDuration = document.getElementById('blockDuration');
            const blockFrom = document.getElementById('blockFrom');
            const blockTill = document.getElementById('blockTill');
            const hoursFields = document.getElementById('hoursFields');
            const submitBtn = document.getElementById('submitBlockBtn');

            const today = new Date().toLocaleDateString('en-CA');
            if (blockDate) blockDate.min = today;

            [venueTabXix, venueTabMirror].forEach(tab => {
                tab.addEventListener('click', () => {
                    selectedVenue = tab.dataset.venue;
                    [venueTabXix, venueTabMirror].forEach(t => t.classList.toggle('active', t === tab));
                    loadBlocks();
                });
            });

            document.querySelectorAll('input[name="blockType"]').forEach(radio => {
                radio.addEventListener('change', () => {
                    const isHours = document.querySelector('input[name="blockType"]:checked').value === 'hours';
                    hoursFields.style.display = isHours ? 'flex' : 'none';
                });
            });

            if (blockDuration) {
                blockDuration.addEventListener('change', () => {
                    const hours = parseInt(blockDuration.value, 10);
                    if (!hours || !blockFrom.value) return;
                    const [h, m] = blockFrom.value.split(':').map(Number);
                    const totalMinutes = h * 60 + m + hours * 60;
                    const endH = Math.floor(totalMinutes / 60) % 24;
                    const endM = totalMinutes % 60;
                    blockTill.value = `${String(endH).padStart(2, '0')}:${String(endM).padStart(2, '0')}`;
                });
            }

            if (blockFrom) {
                blockFrom.addEventListener('change', () => {
                    if (blockDuration.value) {
                        blockDuration.dispatchEvent(new Event('change'));
                    }
                });
            }

            if (submitBtn) {
                submitBtn.addEventListener('click', submitBlock);
            }

            loadBlocks();
        }

        async function submitBlock() {
            const feedback = document.getElementById('blockFeedback');
            feedback.textContent = '';
            feedback.className = 'block-feedback';

            const blockType = document.querySelector('input[name="blockType"]:checked').value;
            const date = document.getElementById('blockDate').value;

            if (!date) {
                feedback.textContent = 'Please select a date.';
                feedback.classList.add('error');
                return;
            }

            const payload = { venue: selectedVenue, date, blockType };

            if (blockType === 'hours') {
                const startTime = document.getElementById('blockFrom').value;
                const endTime = document.getElementById('blockTill').value;
                if (!startTime || !endTime) {
                    feedback.textContent = 'Please provide both a From and Till time (or pick how many hours).';
                    feedback.classList.add('error');
                    return;
                }
                payload.startTime = startTime;
                payload.endTime = endTime;
            }

            try {
                const response = await fetch(`/api/admin/blocks?key=${encodeURIComponent(secretKey)}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const result = await response.json();

                if (!response.ok) {
                    feedback.textContent = result.error || 'Failed to create block';
                    feedback.classList.add('error');
                    return;
                }

                feedback.textContent = blockType === 'full_day'
                    ? `Reservations blocked for ${selectedVenue} on ${date}.`
                    : `Reservations blocked for ${selectedVenue} on ${date} from ${payload.startTime} to ${payload.endTime}.`;
                feedback.classList.add('success');
                loadBlocks();
            } catch (error) {
                console.error('Error creating block:', error);
                feedback.textContent = 'Error creating block. Please try again.';
                feedback.classList.add('error');
            }
        }

        async function loadBlocks() {
            const listEl = document.getElementById('blocksList');
            listEl.innerHTML = '<p style="color: #888;">Loading active blocks...</p>';

            try {
                const response = await fetch(`/api/admin/blocks?venue=${selectedVenue}&key=${encodeURIComponent(secretKey)}`);
                const blocks = await response.json();

                if (!Array.isArray(blocks) || blocks.length === 0) {
                    listEl.innerHTML = '<p style="color: #888;">No upcoming blocks for this venue.</p>';
                    return;
                }

                listEl.innerHTML = blocks.map(block => {
                    const description = block.block_type === 'full_day'
                        ? `<strong>${block.date}</strong> — Whole day blocked`
                        : `<strong>${block.date}</strong> — Blocked ${formatTime(block.start_time)} to ${formatTime(block.end_time)}`;

                    return `
                        <div class="block-item">
                            <div class="block-info">${description}</div>
                            <button class="block-remove-btn" data-id="${block.id}">Remove</button>
                        </div>
                    `;
                }).join('');

                listEl.querySelectorAll('.block-remove-btn').forEach(btn => {
                    btn.addEventListener('click', () => removeBlock(btn.dataset.id));
                });
            } catch (error) {
                console.error('Error loading blocks:', error);
                listEl.innerHTML = '<p style="color: #e74c3c;">Error loading blocks.</p>';
            }
        }

        async function removeBlock(id) {
            try {
                const response = await fetch(`/api/admin/blocks/${id}?key=${encodeURIComponent(secretKey)}`, { method: 'DELETE' });
                if (!response.ok) {
                    const result = await response.json();
                    alert(result.error || 'Failed to remove block');
                    return;
                }
                loadBlocks();
            } catch (error) {
                console.error('Error removing block:', error);
                alert('Error removing block. Please try again.');
            }
        }
    </script>
</body>

</html>
